<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Devnest Home</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      padding: 40px 20px 20px;
      text-align: center;
    }

    header h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    header h3 {
      font-weight: normal;
      color: #666;
    }

    .menu-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      padding: 0 20px 40px;
    }

    .menu-button {
      width: 180px;
      height: 100px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .menu-button:hover {
      background-color: #0056b3;
      transform: translateY(-3px);
    }

    /* 모바일 대응 */
    @media (max-width: 500px) {
      .menu-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h2>오토 트레이딩 봇 with 한국투자증권</h2>
    <h3>원하는 날짜에 자동으로 주식을 매매할 수 있습니다.</h3>
  </header>

  <div class="menu-container">
    <button class="menu-button" onclick="location.href='community.html'">커뮤니티</button>
    <button class="menu-button" onclick="location.href='notice.html'">공지사항</button>
    <button class="menu-button" onclick="location.href='qna.html'">Q&A</button>
    <button class="menu-button" onclick="location.href='profile.html'">내 프로필</button>
    <!-- 더 추가 가능 -->
  </div>

</body>
</html>
