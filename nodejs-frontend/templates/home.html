<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>주식 트레이딩 봇</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      padding: 40px 20px 20px;
      text-align: center;
    }

    header h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    header h3 {
      font-weight: normal;
      color: #666;
    }

    .menu-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      padding: 0 20px 40px;
    }

    .menu-button {
      width: 180px;
      height: 100px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .menu-button:hover {
      background-color: #0056b3;
      transform: translateY(-3px);
    }

    /* 모바일 대응 */
    @media (max-width: 500px) {
      .menu-button {
        width: 100%;
      }
    }

    /* 토큰 패널 */
    .token-panel {
      position: fixed;
      bottom: 200px;
      align-items: center; /* 👉 우측으로 가고 싶으면 right:20px */
      width: 260px;
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      z-index: 1000;
    }

    .token-panel h4 {
      margin: 0 0 15px;
      font-size: 18px;
      text-align: center;
    }

    .token-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .token-item .label {
      color: #666;
      font-size: 14px;
    }

    .token-item .value {
      font-weight: 600;
      font-size: 14px;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 상태 표시 */
    .token-status {
      text-align: center;
      margin-top: 10px;
      padding: 8px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .token-status.valid {
      background-color: #e6f4ea;
      color: #2e7d32;
    }

    .token-status.expired {
      background-color: #fdecea;
      color: #c62828;
    }

    /* 모바일에서는 숨김 */
    @media (max-width: 900px) {
      .token-panel {
        display: none;
      }
    }

  </style>
</head>
<body>

  <header>
    <h2>오토 트레이딩 봇 with 한국투자증권</h2>
    <h3>원하는 종목을 매수, 매도할 수 있습니다.</h3>
  </header>

  <!-- 토큰 정보 패널 -->
  <div class="token-panel">
    <h4>🔐 Access Token</h4>

    <div class="token-item">
      <span class="label">토큰</span>
      <span class="value" id="accessToken">
      </span>
    </div>

    <div class="token-item">
      <span class="label">만료일</span>
      <span class="value" id="tokenExpire">
      </span>
    </div>

    <div class="token-status valid" id="tokenStatus">
      ● 유효
    </div>
  </div>


  <div class="menu-container">
    <button class="menu-button" onclick="location.href='token.html'">토큰 발급(필수)</button>
    <button class="menu-button" onclick="location.href='trade.html'">주식 매매</button>
    <button class="menu-button" onclick="location.href='auto_trade.html'">주식 적립식 매수 등록 (임시)</button>
    <button class="menu-button" onclick="location.href='board.html'">관리자 문의</button>
    <!-- 더 추가 가능 -->
  </div>

</body>
<script src="/static/js/home.js"></script>
<script src="/static/js/ajax_util.js"></script>
<script src="/config/config.js"></script>
</html>
